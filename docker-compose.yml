version: '3.8'

services:
  ros2_jazzy_joy:
    image: osrf/ros:jazzy-desktop #download ros jazzy
    container_name: ros2_jazzy_joy_container
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    volumes:
      - /dev/input:/dev/input #links the hardware port folder. It means: "Whatever joysticks are plugged into my real computer's USB slots, let the virtual workstation see them too."
      - ./src:/workspace/src #links your code folder. It means: "Whatever files I create or edit inside my real computer's src folder, let the virtual workstation see them too."
    working_dir: /workspace #start in workspace when entering docker container
    environment:
      - ROS_DOMAIN_ID=0
    tty: true
    stdin_open: true
    command: >
      bash -c "apt-get update && apt-get install -y ros-jazzy-joy && source /opt/ros/jazzy/setup.bash && ros2 run joy joy_node --ros-args -r __ns:=/stage_1 -p device_id:=0 & ros2 run joy joy_node --ros-args -r __ns:=/stage_2 -p device_id:=1"
